overview: "Stremio addons as Jellyfin library items: search, catalogs and on-demand streams through AIOStreams."
description: >
  Gelato brings AIOStreams (Stremio addons) into Jellyfin. Search results and imported catalogs show up as regular movies and series, and streams are resolved when you press play and proxied through Jellyfin.
category: "General"
# The card in the plugin catalog; Jellyfin downloads it when it reads the repository.
imageUrl: "https://raw.githubusercontent.com/lostb1t/Gelato/main/banner.png"
changelog: >
  Altffour build 0.26.22.119 on upstream main e4ff1b8 (v0.26.22.0 and later fixes, Jellyfin
  12.1): deterministic stream identity (upstream PR #142); JSON converters use TrySkip (fixes
  seasonPosters/enum parse failures under DeserializeAsync); search-result posters are resized
  like library images. A stream sync that finds no streams is remembered per user for
  NoStreamsTTL (default 600 s, 0 = off). When StreamTTL has passed and the user still has the
  title's rows, details reads answer with them at once and the sync runs in the background
  (RefreshStreamsInBackground, default on); playback calls and pre-probes wait for a running
  sync, also when they name one version's own id, and play the first remaining version when the
  sync removed the one asked for. A probe save never brings back a row a sync deleted and keeps
  what a sync wrote meanwhile, the delayed RemuxDB probe included. An item read sent with
  Purpose: prefetch or Sec-Purpose: prefetch (a card hovered or focused) returns its versions and
  syncs streams as before, but schedules no pre-probe; only a real page open does.
  A manifest may list resources as plain names. A tree sync never moves an episode another
  series owns: two catalog entries listing the same episode ids no longer move the episodes back
  and forth on every sync and start; the clash is logged once per series.
  Catalogue items with a native id (kitsu, mal, anilist, anidb) are identified by it: an IMDb id
  change updates the item and keeps the old id as an alias instead of creating a copy.
  A series status follows the add-on (status words like current, finished, Returning Series
  are understood), on catalog import and tree sync; once a week (FullSeriesSyncDays, default 7)
  the tree sync also checks series that are not continuing, so shows that come back get their
  new seasons.
  An episode that hasn't aired yet gets no stream lookup. A search with an API key and no user
  id is answered instead of failing.
  An anime catalogue entry that the anime id mapping list (FileSplitSeasons, AnimeMappingUrl)
  names as a season of a show in the library is filed as that season of the show instead of
  becoming a show of its own; episodes the show has already are never moved or renumbered.
  Only seasons 2 and up are filed, in catalogue id order, so the show itself is never taken
  over by its later season and, within one import run, the result doesn't depend on the order
  entries are found in (across runs, the entry filed first keeps the season). An entry whose
  season the show already has with at least as many episodes as the entry is left out, as
  before; when the show has fewer episodes in that season (a second cour), the entry stays a
  show of its own instead of being left out.
  A later season, OVA or second season 1 entry kept as a show of its own (known by its native
  id, also when it carries the show's IMDb id) is not taken for the show when a later season
  is filed, so it no longer stops that season from being filed. An item found by any of its
  native ids, not only the first one, is that item and is not added again.
  A catalogue item with a native id that is already in the library by its IMDb id only (added
  from a catalogue without native ids, like Cinemeta) is matched and takes the native id
  instead of being added again, and two entries imported at the same time can't both take the
  same show. With FileSplitSeasons on and the mapping list saved, a series is not taken by an
  entry the list names as a later season, specials or a second season 1 entry (of several
  season 1 TV entries, the one with the lowest id is the show; a film, ONA or special placed in
  season 1 is never the show while there is a TV entry), since those share the show's IMDb
  id; they stay shows of their own. The lowest id is taken per id kind (MAL, Kitsu, AniList,
  AniDB), so when the list leaves out an id of the first part, a later part can be the lowest
  of that kind and count as season 1. With FileSplitSeasons off, before the list is first saved,
  or for an entry the list doesn't have, the match is made as before; also while the list is
  being downloaded. An IMDb id change is not applied when another item already has that id.
  Episodes due within the next day get a stream lookup, and skipping an unaired one is not
  remembered as no streams.
  A read-only "Possible duplicates report" task (weekly; GET /gelato/duplicates) lists items
  with the same native id, series that list episodes all owned by another series (the same
  show), items with no native id that share both TVDB and TMDB ids but not the IMDb id (an IMDb
  id change), and other same TVDB/TMDB ids as maybe. A manual exclude list (ExcludedIds) keeps titles from
  being created.
  The plugin settings page shows the possible-duplicates report (likely, related, maybe, with
  links to the items), a Run report now button, and the exclude list with add and remove.
  Watch state parked by a delete is reattached even when the re-added item already holds a row
  for the same user and key: the newer play wins (as Jellyfin does) and the parked row is
  removed, on insert and in the Repair watch state task. Jellyfin 12.1 reattaches all or nothing,
  so one collision used to leave every parked row behind.
  A season filed from a split anime entry is not added again when the show's own data later
  lists that season under other episode numbers; the filed episodes stay the season.
  The weekly pass counts as done only when most series synced (an add-on outage no longer puts
  the recheck off a week), and its time is kept in data/gelato/last-full-series-sync.txt instead
  of rewriting the plugin configuration.
  The tree sync reuses a meta fetched under a minute ago instead of always asking the add-on
  again, and the weekly pass runs 2 requests at a time instead of 4.
  Anime mapping list: https only (http to local addresses), 64 MB limit, refetched when the URL
  changes, retried within an hour after a failure. Year ranges with an en dash are read.
  Probe results are kept on this server by file (info hash and file index, up to 2000 files),
  so a file probed once shows its tracks for every row and user that gets it; off switch on the
  plugin page.
  The media-info cache file is written at most once a minute instead of after every probe.
  The media-info cache keeps up to 2000 files (about 45 MB at measured entry sizes).
  Review fixes: probes skipped by the one-a-minute limit are written a minute later and on
  shutdown; a cache, report or state file that can't be read or written no longer fails a probe,
  playback or tree sync; files without a file index are cached by size instead (a season pack
  shared one entry, and such entries are dropped on load); rows filled from the cache get one
  follow-up probe 30 s into their first playback, as RemuxDB rows do (segments, fonts,
  chapters), and that probe is not contributed to RemuxDB; external subtitles aren't cached;
  users with their own settings keep the exclude list and split-season filing; ids inside an
  exclude-list note no longer count as entries.
