changelog: >
  Altffour build 0.26.20.105: a stream sync that finds no streams is remembered per user
  for NoStreamsTTL (default 600 s, 0 = off), so the title isn't asked for again on every call.
  When StreamTTL has passed and the user still has the title's rows, details reads answer with
  them at once and the sync runs in the background (RefreshStreamsInBackground, default on);
  playback calls still wait for the sync, also when they name one version's own id, and a probe
  is not saved over a row a sync deleted or rewrote meanwhile.
