changelog: >
  Altffour build 0.26.20.106 on upstream main ebfd9f1 (Jellyfin 12.1, native versions):
  deterministic stream identity (upstream PR #142); JSON converters use TrySkip (fixes
  seasonPosters/enum parse failures under DeserializeAsync); search-result posters are resized
  like library images. A stream sync that finds no streams is remembered per user for
  NoStreamsTTL (default 600 s, 0 = off). When StreamTTL has passed and the user still has the
  title's rows, details reads answer with them at once and the sync runs in the background
  (RefreshStreamsInBackground, default on); playback calls still wait for the sync, also when
  they name one version's own id, play the first remaining version when the sync removed the
  one asked for, and a probe is not saved over a row or movie a sync deleted or rewrote meanwhile.
