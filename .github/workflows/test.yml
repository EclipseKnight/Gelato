name: Test
on:
  push:
    branches:
      - "altffour/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Gelato.sln -c Release

      - name: Test
        run: dotnet test tests/Gelato.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  scenarios:
    # End-to-end runs against a throwaway Jellyfin 12.1 container and the fake add-on
    # (tests/scenario/run.py): re-keying, aliases, split seasons, the weekly pass and more.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pull Jellyfin 12.1
        run: docker pull jellyfin/jellyfin:12.1

      - name: Scenario runs
        run: python3 tests/scenario/run.py
